version: "3.8"
services:
  # Loki - хранилище для логов
  loki:
    env_file: ".env"
    user: "1000:1000"
    image: grafana/loki:2.9.3
    container_name: loki
    ports:
      - "$LOKI_PORT:3100"
    volumes:
      - $CONFIG_DIR/loki.yml:/etc/loki/local-config.yaml
      - $LOKI_DATA_PATH:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - monitoring
    restart: no

  # Promtail - агент для сбора логов
  promtail:
    env_file: ".env"
    image: grafana/promtail:2.9.3
    container_name: promtail
    volumes:
      - $CONFIG_DIR/promtail.yml:/etc/promtail/config.yml
      - $LOG_SOURCE_PATH:/var/log/app:ro
      # Для сбора логов из разных источников можно добавить дополнительные volumes
      # - /path/to/another/logs:/var/log/another:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - monitoring
    restart: no
    depends_on:
      - loki

  # Grafana - визуализация и дашборды
  grafana:
    env_file: ".env"
    image: grafana/grafana:10.2.3
    container_name: grafana
    ports:
      - "$GRAFANA_PORT:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=$GRAFANA_ADMIN_USER
      - GF_SECURITY_ADMIN_PASSWORD=$GRAFANA_ADMIN_PASSWORD
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_LOG_LEVEL=info
      - GF_INSTALL_PLUGINS=
    volumes:
      - $GRAFANA_DATA_PATH:/var/lib/grafana
      - $CONFIG_DIR/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - monitoring
    restart: no
    depends_on:
      - loki

networks:
  monitoring:
    driver: bridge
