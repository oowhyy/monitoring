# Конфигурация Loki
# Документация: https://grafana.com/docs/loki/latest/configuration/

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

# Настройки схемы хранения
schema_config:
  configs:
    - from: 2023-01-01
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

# Настройки хранения индексов
storage_config:
  boltdb_shipper:
    active_index_directory: /loki/boltdb-shipper-active
    cache_location: /loki/boltdb-shipper-cache
    cache_ttl: 24h
    shared_store: filesystem
  filesystem:
    directory: /loki/chunks

# Ограничения и лимиты
limits_config:
  # Максимальный размер запроса
  enforce_metric_name: false
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 20
  per_stream_rate_limit: 5MB
  per_stream_rate_limit_burst: 15MB
  max_entries_limit_per_query: 10000
  max_query_series: 1000
  max_query_parallelism: 32

# Настройки компакции
compactor:
  working_directory: /loki/boltdb-shipper-compactor
  shared_store: filesystem
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150

# Настройки retention (хранение логов)
# По умолчанию логи хранятся 30 дней
chunk_store_config:
  max_look_back_period: 720h # 30 дней

table_manager:
  retention_deletes_enabled: true
  retention_period: 720h # 30 дней

# Настройки запросов
query_range:
  # Кэширование результатов запросов
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100
